# Stack Monitoring Opsional (Prometheus + Grafana) untuk Backend RSA UGM
# Dirancang ringan dan aman untuk VPS kampus dengan batas RAM ketat dan retensi data 7 hari.
#
# Cara menjalankan bersama stack utama:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
#
# Cara mematikan monitoring saja (tanpa mematikan backend/DB/MQTT):
#   docker compose -f docker-compose.monitoring.yml down

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: water_tank_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=512MB"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_BIND_HOST:-127.0.0.1}:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    cpus: "0.50"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: water_tank_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_HOST:-0.0.0.0}:${GRAFANA_PORT:-9000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    cpus: "0.50"

volumes:
  prometheus_data:
  grafana_data:
