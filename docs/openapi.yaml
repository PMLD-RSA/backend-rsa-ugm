openapi: 3.0.3
info:
  title: Hospital Water Tank Monitoring API
  description: |
    Spesifikasi Backend REST API, Realtime WebSocket Stream, dan MQTT Ingestion untuk Sistem Monitoring Tangki Air Rumah Sakit (RSA UGM).

    ### Protokol & Saluran Komunikasi
    1. **REST API:** `http://<host>:8000` (Manajemen tangki, histori pembacaan, audit log, pengguna, laporan CSV).
    2. **Realtime WebSocket:** `ws://<host>:8000/ws` (Streaming telemetri langsung & notifikasi peringatan ambang batas).
    3. **MQTT Broker:** `mqtt://<host>:1883` (Ingestion data sensor STM32 & LoRa Gateway).
       * Topik Level: `hospital/{tank_id}/level` (QoS 0)
       * Topik Status: `hospital/{tank_id}/status` (QoS 1)
       * Topik Heartbeat: `hospital/{tank_id}/heartbeat` (QoS 0)

    ### Keamanan & Otentikasi
    * **JWT Bearer Token:** Diperoleh melalui `POST /api/auth/login`, digunakan untuk otentikasi operator dan admin.
    * **Gateway Key (`X-Gateway-Key`):** Kunci pra-berbagi (*pre-shared key*) untuk otentikasi sinkronisasi perangkat keras Raspberry Pi.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health Check
      description: Returns health status of the API, database connection, Redis, and active WebSocket client count.
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System is degraded

  /api/tanks:
    get:
      summary: List all water tanks
      description: Returns all monitored water tanks with their latest reading, active alert, and attached sensor nodes.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TankDetail'
    post:
      summary: Create new tank (Admin only)
      description: Registers a new water tank into the monitoring system.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTankInput'
      responses:
        '201':
          description: Tank created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Tank'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)

  /api/tanks/{id}:
    get:
      summary: Get tank details
      description: Returns single tank details along with the 50 most recent readings and 10 recent alerts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TankWithRecentHistory'
        '404':
          description: Tank not found
    patch:
      summary: Update tank metadata / threshold limits (Admin only)
      description: Update specific fields of a water tank.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTankInput'
      responses:
        '200':
          description: Tank updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Tank'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Tank not found
    put:
      summary: Replace / update tank data (Admin only)
      description: Idempotent update for water tank properties.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTankInput'
      responses:
        '200':
          description: Tank updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Tank'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Tank not found
    delete:
      summary: Delete tank (Admin only)
      description: Remove a tank master record and log audit trail.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tank deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tank deleted successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Tank not found

  /api/tanks/{id}/readings:
    get:
      summary: Get historical time-series readings for a tank
      description: Fetch time-series water level readings for a specific tank for charting and trend analysis.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
          description: Number of historical hours to query
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
          description: Maximum number of records to return
      responses:
        '200':
          description: List of time-series readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  tankId:
                    type: string
                    format: uuid
                  hours:
                    type: integer
                    example: 24
                  count:
                    type: integer
                    example: 288
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reading'

  /api/readings/latest:
    get:
      summary: Get latest readings for all tanks
      description: Returns current water level readings and remaining volume for every tank.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Latest readings for all tanks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TankLatestReading'
        '401':
          description: Unauthorized

  /api/readings/history:
    get:
      summary: Get aggregated readings history across all tanks
      description: Retrieve historical time-series readings across multiple tanks within specified hours.
      security:
        - BearerAuth: []
      parameters:
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
          description: Number of historical hours to fetch
      responses:
        '200':
          description: Historical readings across all tanks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reading'
        '401':
          description: Unauthorized

  /api/alerts:
    get:
      summary: List alerts
      description: Retrieve list of threshold alerts, optionally filtered by status.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, resolved]
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
        '401':
          description: Unauthorized

  /api/alerts/{id}/resolve:
    patch:
      summary: Manually resolve alert (Operator / Admin)
      description: Mark an active alert as resolved. Broadcasts ALERT_RESOLVED event over WebSocket.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Alert marked as resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Alert'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Operator or Admin role required)
        '404':
          description: Alert not found
    put:
      summary: Manually resolve alert (Idempotent)
      description: Mark an active alert as resolved.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Alert marked as resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Alert'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Operator or Admin role required)
        '404':
          description: Alert not found

  /api/gateways:
    get:
      summary: List all LoRa gateways
      description: Returns list of Raspberry Pi gateways with their connected STM32 sensor nodes.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of gateways
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Gateway'
        '401':
          description: Unauthorized

  /api/gateways/{deviceCode}/sync:
    get:
      summary: Synchronize gateway and sensor nodes mapping
      description: Used by Raspberry Pi gateway on boot to discover monitored tank IDs, sensor node mappings, and tank capacities.
      security:
        - GatewayKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: deviceCode
          in: path
          required: true
          schema:
            type: string
            example: "GW-HUB-01"
        - name: X-Gateway-Key
          in: header
          required: false
          schema:
            type: string
          description: Pre-shared gateway security key
      responses:
        '200':
          description: Gateway mappings successfully synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySyncResponse'
        '401':
          description: Unauthorized (Invalid gateway key or missing token)
        '404':
          description: Gateway device code not found

  /api/nodes:
    get:
      summary: List all sensor nodes
      description: Returns all STM32 sensor nodes with attached tank and gateway information.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of sensor nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SensorNode'
        '401':
          description: Unauthorized

  /api/auth/login:
    post:
      summary: User Login
      description: Authenticate user credentials and return a JWT Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid username or password

  /api/auth/me:
    get:
      summary: Get current authenticated user
      description: Returns profile of the user currently logged in.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /api/users:
    get:
      summary: List all users (Admin only)
      description: Retrieve list of system operators and admins.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
    post:
      summary: Create user (Admin only)
      description: Register a new operator, viewer, or admin account.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Pengguna baru berhasil dibuat"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Username already in use

  /api/users/{id}:
    patch:
      summary: Update user role / active status / password (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Pengguna berhasil diperbarui"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: User not found
    put:
      summary: Update user (Idempotent, Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found
    delete:
      summary: Delete user account (Admin only)
      description: Remove a user account permanently from the system.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User deleted successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: User not found

  /api/audit-logs:
    get:
      summary: List system audit logs (Admin only)
      description: Retrieve chronological log of user activities and configuration changes.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: entity
          in: query
          schema:
            type: string
            example: tanks
      responses:
        '200':
          description: List of audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)

  /api/reports/readings/export:
    get:
      summary: Export historical readings
      description: Download water level readings formatted as CSV.
      security:
        - BearerAuth: []
      parameters:
        - name: tankId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx, pdf]
            default: csv
      responses:
        '200':
          description: File download binary stream
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Missing required tankId
        '401':
          description: Unauthorized

  /api/reports/alerts/export:
    get:
      summary: Export alerts history
      description: Download alerts history formatted as CSV.
      security:
        - BearerAuth: []
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [WARNING, CRITICAL]
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx, pdf]
            default: csv
      responses:
        '200':
          description: File download binary stream
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized

  /ws:
    get:
      summary: Realtime WebSocket Stream
      description: |
        Endpoint koneksi WebSocket dua arah untuk streaming data telemetri level air dan notifikasi alert secara realtime.

        URL Akses: `ws://<host>:8000/ws`

        **Daftar Event Broadcast Server:**
        * `CONNECTED`: Dikirimkan server begitu client pertama kali terhubung.
        * `LEVEL_UPDATE`: Disiarkan instan setiap kali sensor membaca volume/level air baru dari tangki.
        * `ALERT_TRIGGERED`: Disiarkan instan saat level air menembus ambang batas (WARNING 30-60% atau CRITICAL <30%).
        * `ALERT_RESOLVED`: Disiarkan saat kondisi air normal kembali atau alert diselesaikan manual oleh operator.
        * `NODE_STATUS`: Disiarkan saat status konektivitas node sensor STM32 berubah (online/offline/error).
      responses:
        '101':
          description: Switching Protocols ke WebSocket connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketEvent'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        services:
          type: object
          properties:
            database:
              type: string
              example: up
            redis:
              type: string
              example: up
        websocketClients:
          type: integer
          example: 2
        timestamp:
          type: string
          format: date-time

    WebSocketEvent:
      type: object
      properties:
        type:
          type: string
          enum: [CONNECTED, LEVEL_UPDATE, ALERT_TRIGGERED, ALERT_RESOLVED, NODE_STATUS]
          example: "LEVEL_UPDATE"
        message:
          type: string
          nullable: true
          example: "Terhubung ke stream realtime monitoring tangki"
        data:
          type: object
          nullable: true
          description: Payload dinamis sesuai event type
        timestamp:
          type: string
          format: date-time
          example: "2026-10-01T02:25:00.000Z"

    Tank:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Tangki Atap Gedung Utama"
        location:
          type: string
          nullable: true
          example: "Atap Gedung A (Utama), Lantai 5"
        capacityLiters:
          type: string
          example: "10000.00"
        minThresholdPercent:
          type: string
          example: "30.00"
        maxThresholdPercent:
          type: string
          example: "90.00"
        latitude:
          type: string
          nullable: true
          example: "-7.7428450"
        longitude:
          type: string
          nullable: true
          example: "110.3511200"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTankInput:
      type: object
      required:
        - name
        - capacityLiters
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Tangki Gedung Laboratorium"
        location:
          type: string
          maxLength: 150
          example: "Gedung Lab Terpadu Lantai 4"
        capacityLiters:
          type: number
          example: 6000
        minThresholdPercent:
          type: number
          default: 30
          example: 30
        maxThresholdPercent:
          type: number
          default: 90
          example: 90
        latitude:
          type: number
          nullable: true
          example: -7.742845
        longitude:
          type: number
          nullable: true
          example: 110.35112

    UpdateTankInput:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        capacityLiters:
          type: number
        minThresholdPercent:
          type: number
        maxThresholdPercent:
          type: number
        latitude:
          type: number
          nullable: true
          example: -7.742845
        longitude:
          type: number
          nullable: true
          example: 110.35112

    Reading:
      type: object
      properties:
        id:
          type: integer
          example: 14205
        tankId:
          type: string
          format: uuid
        sensorNodeId:
          type: string
          format: uuid
          nullable: true
        levelPercent:
          type: string
          example: "72.40"
        volumeLiters:
          type: string
          example: "7240.00"
        rawValue:
          type: string
          nullable: true
          example: "812.00"
        rssi:
          type: integer
          nullable: true
          example: -78
        recordedAt:
          type: string
          format: date-time

    TankLatestReading:
      type: object
      properties:
        tankId:
          type: string
          format: uuid
        tankName:
          type: string
          example: "Tangki Atap Gedung Utama"
        reading:
          $ref: '#/components/schemas/Reading'
          nullable: true

    Alert:
      type: object
      properties:
        id:
          type: integer
          example: 89
        tankId:
          type: string
          format: uuid
        tankName:
          type: string
          example: "Tangki Gedung IBS"
        tankLocation:
          type: string
          nullable: true
        level:
          type: string
          enum: [WARNING, CRITICAL]
          example: "CRITICAL"
        message:
          type: string
          example: "Level air tangki IBS CRITICAL: 24.5%"
        status:
          type: string
          enum: [active, resolved]
          example: "active"
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    Gateway:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceCode:
          type: string
          example: "GW-HUB-01"
        status:
          type: string
          example: "online"
        lastHeartbeat:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        nodesCount:
          type: integer
          example: 3
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SensorNode'

    GatewaySyncResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        gatewayCode:
          type: string
          example: "GW-HUB-01"
        syncedAt:
          type: string
          format: date-time
        mappings:
          type: array
          items:
            type: object
            properties:
              deviceCode:
                type: string
                example: "STM32-GEDUNG-A"
              sensorNodeId:
                type: string
                format: uuid
              tankId:
                type: string
                format: uuid
              tankName:
                type: string
                example: "Tangki Atap Gedung Utama"
              capacityLiters:
                type: string
                example: "10000.00"

    SensorNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tankId:
          type: string
          format: uuid
        gatewayId:
          type: string
          format: uuid
          nullable: true
        deviceCode:
          type: string
          example: "STM32-GEDUNG-A"
        sensorType:
          type: string
          example: "ultrasonic"
        status:
          type: string
          example: "active"
        lastRssi:
          type: integer
          nullable: true
          example: -78
        lastSeen:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TankDetail:
      allOf:
        - $ref: '#/components/schemas/Tank'
        - type: object
          properties:
            latestReading:
              $ref: '#/components/schemas/Reading'
              nullable: true
            activeAlert:
              $ref: '#/components/schemas/Alert'
              nullable: true
            nodes:
              type: array
              items:
                $ref: '#/components/schemas/SensorNode'

    TankWithRecentHistory:
      allOf:
        - $ref: '#/components/schemas/Tank'
        - type: object
          properties:
            recentReadings:
              type: array
              items:
                $ref: '#/components/schemas/Reading'
            recentAlerts:
              type: array
              items:
                $ref: '#/components/schemas/Alert'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: "admin"
        role:
          type: string
          enum: [admin, operator, viewer]
          example: "admin"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          example: "password123"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login berhasil"
        data:
          type: object
          properties:
            token:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            user:
              $ref: '#/components/schemas/User'

    CreateUserInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          example: "operator_shift1"
        password:
          type: string
          minLength: 6
          example: "passwordAman123"
        role:
          type: string
          enum: [admin, operator, viewer]
          default: operator

    UpdateUserInput:
      type: object
      properties:
        role:
          type: string
          enum: [admin, operator, viewer]
        isActive:
          type: boolean
        password:
          type: string
          minLength: 6

    AuditLog:
      type: object
      properties:
        id:
          type: integer
          example: 105
        userId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          example: "RESOLVE_ALERT"
        entity:
          type: string
          example: "alerts"
          nullable: true
        entityId:
          type: string
          example: "89"
          nullable: true
        detail:
          type: string
          nullable: true
          example: "Alert level CRITICAL diselesaikan secara manual oleh admin"
        ipAddress:
          type: string
          nullable: true
          example: "192.168.1.45"
        createdAt:
          type: string
          format: date-time

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token obtained from /api/auth/login
    GatewayKeyAuth:
      type: apiKey
      in: header
      name: X-Gateway-Key
      description: Pre-shared API Key header for LoRa Gateway synchronization
