global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # Memantau diri sendiri (Prometheus)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Memantau Backend Fastify + MQTT Worker + Redis Stream + Batch Writer
  # Menggunakan host.docker.internal agar kompatibel saat backend berjalan di PM2/host VPS
  - job_name: "rsa_ugm_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "backend-rsa-ugm"
          environment: "campus-vps"
